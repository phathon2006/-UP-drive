<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UP Drive - Passenger</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

</head>

<body>

<nav class="navbar">

  <div class="logo">
    🚗 UP Drive
  </div>

  <div class="nav-links">

    <a href="/passenger.html">
      เดินทาง
    </a>

    <a href="/history.html">
      ประวัติ
    </a>

    <button onclick="logout()">
      ออกจากระบบ
    </button>

  </div>

</nav>

<main class="container">

  <div
    id="message"
    style="display:none"
  ></div>

  <section class="hero">

    <h1>
      ผู้โดยสาร
    </h1>

    <p id="welcome">
      กำลังโหลด...
    </p>

  </section>

  <div class="grid">

    <!-- CREATE RIDE -->

    <section class="card">

      <h2>
        🚗 สร้างรายการเดินทาง
      </h2>

      <form id="rideForm">

        <div class="form-group">

          <label>
            ต้นทาง
          </label>

          <div class="actions">

            <input
              id="origin"
              placeholder="เช่น หอพักใกล้ ม.พะเยา"
              required
            >

            <button
              type="button"
              class="btn btn-location"
              onclick="useCurrentLocation()"
            >
              📍 GPS
            </button>

            <button
              type="button"
              class="btn btn-location"
              onclick="startPinMode('origin')"
            >
              📌 ปักหมุด
            </button>

          </div>

          <input
            id="originDetail"
            placeholder="รายละเอียดต้นทาง เช่น หอพักชื่อ... หน้าประตู..."
            style="margin-top:8px"
          >

        </div>

        <div class="form-group">

          <label>
            ปลายทาง
          </label>

          <div class="actions">

            <input
              id="destination"
              placeholder="เช่น มหาวิทยาลัยพะเยา"
              required
            >

            <button
              type="button"
              class="btn btn-location"
              onclick="startPinMode('destination')"
            >
              📌 ปักหมุด
            </button>

          </div>

          <input
            id="destinationDetail"
            placeholder="รายละเอียดปลายทาง เช่น อาคาร... ชั้น..."
            style="margin-top:8px"
          >

        </div>

        <div class="form-group">

          <label>
            จำนวนผู้โดยสารเป้าหมายของกลุ่ม
          </label>

          <input
            id="targetPassengers"
            type="number"
            min="1"
            max="10"
            value="2"
            required
          >

          <div class="muted small">
            จำนวนนี้เป็นเป้าหมายของกลุ่ม
            ไม่จำเป็นต้องครบก่อนส่งงานให้คนขับ
          </div>

        </div>

        <button
          class="btn btn-primary btn-block"
          type="submit"
          id="createRideButton"
        >
          🔎 ค้นหาผู้โดยสารเส้นทางใกล้กัน
        </button>

      </form>

    </section>

    <!-- GROUP -->

    <section class="card">

      <h2>
        👥 กลุ่มเดินทาง
      </h2>

      <div id="groupBox">

        <div class="empty">
          ยังไม่มีรายการเดินทาง
        </div>

      </div>

    </section>

  </div>

  <br>

  <!-- MAP -->

  <section class="card">

    <h2>
      🗺️ แผนที่และเส้นทาง
    </h2>

    <div
      id="map"
      class="map"
    ></div>

  </section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/map.js"></script>

<script>

const $ = (id) =>
  document.getElementById(id);

let session = null;

let profile = null;

let activeRide = null;

let activeGroup = null;

let currentOrigin = null;

let currentDestination = null;

let pinMode = null;

let pinMarkerOrigin = null;

let pinMarkerDestination = null;

let realtimeChannel = null;

function getSession() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "up_drive_session"
      )
    );

  } catch {

    return null;

  }
}

function getProfile() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "up_drive_profile"
      )
    );

  } catch {

    return null;

  }
}

function showMessage(
  text,
  type = "error"
) {

  const box =
    $("message");

  box.className =
    `alert ${
      type === "success"
        ? "alert-success"
        : "alert-error"
    }`;

  box.textContent =
    text;

  box.style.display =
    "block";
}

function escapeHtml(value) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

async function api(
  url,
  options = {}
) {

  const token =
    session?.access_token;

  const response =
    await fetch(
      url,
      {
        ...options,

        headers: {
          "Content-Type":
            "application/json",

          ...(token
            ? {
                Authorization:
                  `Bearer ${token}`
              }
            : {}),

          ...(options.headers || {})
        }
      }
    );

  const data =
    await response
      .json()
      .catch(() => ({}));

  if (
    response.status === 401
  ) {

    logout();

    throw new Error(
      "Session หมดอายุ"
    );

  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      "เกิดข้อผิดพลาด"
    );

  }

  return data;
}

/* =====================================================
   GPS
===================================================== */

async function useCurrentLocation() {

  if (
    !navigator.geolocation
  ) {

    showMessage(
      "Browser นี้ไม่รองรับ GPS"
    );

    return;

  }

  showMessage(
    "กำลังอ่านตำแหน่ง GPS...",
    "success"
  );

  navigator.geolocation.getCurrentPosition(
    async (position) => {

      try {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        currentOrigin = {
          lat,
          lng
        };

        if (pinMarkerOrigin) {

          upMap.removeLayer(
            pinMarkerOrigin
          );

          pinMarkerOrigin =
            null;

        }

        const name =
          await reverseGeocode(
            lat,
            lng
          );

        $("origin").value =
          name;

        showMessage(
          "ใช้ตำแหน่งปัจจุบันเป็นต้นทางแล้ว",
          "success"
        );

        showRidePreview();

      } catch (error) {

        showMessage(
          error.message
        );

      }

    },

    () => {

      showMessage(
        "ไม่สามารถอ่าน GPS ได้ กรุณาอนุญาต Location ใน Browser"
      );

    },

    {
      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0
    }
  );
}

/* =====================================================
   PIN ON MAP (ปักหมุดเอง)
===================================================== */

function startPinMode(mode) {

  pinMode = mode;

  showMessage(
    mode === "origin"
      ? "คลิกบนแผนที่เพื่อปักหมุดต้นทาง"
      : "คลิกบนแผนที่เพื่อปักหมุดปลายทาง",
    "success"
  );

}

async function reverseGeocode(lat, lng) {

  try {

    const response =
      await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`,
        {
          headers: {
            "Accept-Language": "th"
          }
        }
      );

    const data =
      await response.json();

    return (
      data.display_name ||
      `${lat.toFixed(5)}, ${lng.toFixed(5)}`
    );

  } catch {

    return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

  }

}

async function onMapClick(event) {

  if (!pinMode) {
    return;
  }

  const lat =
    event.latlng.lat;

  const lng =
    event.latlng.lng;

  const mode =
    pinMode;

  pinMode =
    null;

  showMessage(
    "กำลังอ่านชื่อสถานที่...",
    "success"
  );

  const name =
    await reverseGeocode(
      lat,
      lng
    );

  if (mode === "origin") {

    currentOrigin = {
      lat,
      lng
    };

    $("origin").value =
      name;

    if (pinMarkerOrigin) {
      upMap.removeLayer(
        pinMarkerOrigin
      );
    }

    pinMarkerOrigin =
      L.marker([lat, lng])
        .addTo(upMap)
        .bindPopup("📍 ต้นทาง")
        .openPopup();

    showMessage(
      "ปักหมุดต้นทางแล้ว",
      "success"
    );

  } else {

    currentDestination = {
      lat,
      lng
    };

    $("destination").value =
      name;

    if (pinMarkerDestination) {
      upMap.removeLayer(
        pinMarkerDestination
      );
    }

    pinMarkerDestination =
      L.marker([lat, lng])
        .addTo(upMap)
        .bindPopup("🏁 ปลายทาง")
        .openPopup();

    showMessage(
      "ปักหมุดปลายทางแล้ว",
      "success"
    );

  }

  showRidePreview();

}

/* =====================================================
   FORM
===================================================== */

$("rideForm").addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    const button =
      $("createRideButton");

    button.disabled =
      true;

    button.textContent =
      "กำลังค้นหา...";

    try {

      if (!currentOrigin) {

        showMessage(
          "กรุณาระบุต้นทาง (GPS หรือปักหมุด)"
        );

        button.disabled = false;

        button.textContent =
          "🔎 ค้นหาผู้โดยสารเส้นทางใกล้กัน";

        return;

      }

      if (!currentDestination) {

        showMessage(
          "กรุณาปักหมุดปลายทางบนแผนที่"
        );

        button.disabled = false;

        button.textContent =
          "🔎 ค้นหาผู้โดยสารเส้นทางใกล้กัน";

        return;

      }

      const data =
        await api(
          "/api/rides",
          {
            method: "POST",

            body:
              JSON.stringify({

                origin_text:
                  $("origin").value,

                destination_text:
                  $("destination").value,

                origin_detail:
                  $("originDetail").value,

                destination_detail:
                  $("destinationDetail").value,

                target_passengers:
                  Number(
                    $("targetPassengers")
                      .value
                  ),

                origin_lat:
                  currentOrigin.lat,

                origin_lng:
                  currentOrigin.lng,

                destination_lat:
                  currentDestination.lat,

                destination_lng:
                  currentDestination.lng

              })
          }
        );

      activeRide =
        data.ride || data.request;

      activeGroup =
        data.group;

      renderGroup();

      subscribeRealtime();

      showMessage(
        "สร้างรายการเดินทางเรียบร้อย",
        "success"
      );

    } catch (error) {

      showMessage(
        error.message
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "🔎 ค้นหาผู้โดยสารเส้นทางใกล้กัน";

    }

  }
);

/* =====================================================
   RENDER GROUP
===================================================== */

function renderGroup() {

  if (!activeGroup) {

    $("groupBox").innerHTML =
      `
        <div class="empty">
          ยังไม่มีข้อมูลกลุ่ม
        </div>
      `;

    return;

  }

  showGroupOnMap(
    activeGroup
  );

  const statusClass =
    activeGroup.status ===
    "accepted"
      ? "status status-success"
      : activeGroup.status ===
        "sent_to_driver"
      ? "status status-warning"
      : "status";

  let html =
    `
      <div>

        <span class="${statusClass}">
          ${escapeHtml(
            activeGroup.status_label
          )}
        </span>

        <div class="grid-3" style="margin-top:15px">

          <div class="stat">
            <div class="stat-number">
              ${activeGroup.actual_passengers}
            </div>
            <div>
              ผู้โดยสารปัจจุบัน
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
              ${activeGroup.target_passengers}
            </div>
            <div>
              เป้าหมาย
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
              ${
                activeGroup.members
                  ?.filter(
                    m =>
                      m.confirmed
                  )
                  .length || 0
              }
            </div>
            <div>
              ยืนยันแล้ว
            </div>
          </div>

        </div>

        <hr>

        <h3>
          สมาชิก
        </h3>
    `;

  for (
    const member of
    activeGroup.members || []
  ) {

    html +=
      `
        <div class="member">

          <div class="member-row">

            <strong>
              👤 ${
                escapeHtml(
                  member.passenger?.name
                )
              }
            </strong>

            ${
              member.confirmed
                ? `
                  <span class="status status-success">
                    ✓ ยืนยันแล้ว
                  </span>
                `
                : `
                  <span class="status status-warning">
                    รอยืนยัน
                  </span>
                `
            }

          </div>

          <div class="route-line">

            <div class="point point-pickup">
              📍
              ${escapeHtml(
                member.ride?.origin_text
              )}
              ${
                member.ride?.origin_detail
                  ? `<br><small>${escapeHtml(
                      member.ride.origin_detail
                    )}</small>`
                  : ""
              }
            </div>

            <div class="point point-destination">
              🏁
              ${escapeHtml(
                member.ride?.destination_text
              )}
              ${
                member.ride?.destination_detail
                  ? `<br><small>${escapeHtml(
                      member.ride.destination_detail
                    )}</small>`
                  : ""
              }
            </div>

          </div>

        </div>
      `;

  }

  if (
    activeGroup.status ===
    "forming"
  ) {

    const myMember =
      activeGroup.members.find(
        m =>
          m.passenger_id ===
          profile.id
      );

    if (
      myMember &&
      !myMember.confirmed
    ) {

      html +=
        `
          <button
            class="btn btn-primary btn-block"
            onclick="confirmGroup()"
          >
            ✓ ยืนยันกลุ่มเดินทาง
          </button>

          <p class="muted small">
            เมื่อสมาชิกปัจจุบันทุกคนยืนยัน
            ระบบจะส่งงานให้คนขับทันที
            โดยไม่ต้องรอให้จำนวนถึงเป้าหมาย
          </p>
        `;

    } else {

      html +=
        `
          <div class="alert alert-success">
            ✓ คุณยืนยันแล้ว
            กำลังรอสมาชิกคนอื่น
          </div>
        `;

    }

  }

  if (
    activeGroup.status ===
    "sent_to_driver"
  ) {

    html +=
      `
        <div class="alert alert-success">

          🚗 ส่งงานให้คนขับแล้ว

          <br>

          กำลังรอคนขับรับงาน

        </div>
      `;

  }

  /*
   * ผู้โดยสารยกเลิกได้
   * เฉพาะตอนคนขับยังไม่รับงาน
   */

  if (
    activeGroup.status ===
      "forming" ||
    activeGroup.status ===
      "sent_to_driver"
  ) {

    html +=
      `
        <button
          class="btn btn-block"
          style="background:#ef4444;color:#fff;margin-top:10px"
          onclick="cancelRide()"
        >
          ✕ ยกเลิกการเดินทาง
        </button>
      `;

  }

  if (
    activeGroup.status ===
    "accepted"
  ) {

    html +=
      `
        <div class="alert alert-success">

          🚗 คนขับรับงานแล้ว

          ${
            activeGroup.driver
              ? `
                <br><br>
                <strong>
                  คนขับ:
                </strong>
                ${escapeHtml(
                  activeGroup.driver.name
                )}

                <br>

                <strong>
                  โทร:
                </strong>
                ${escapeHtml(
                  activeGroup.driver.phone
                )}

                <br>

                <strong>
                  รถ:
                </strong>
                ${
                  activeGroup.driver
                    .vehicle_seats
                } ที่นั่ง
              `
              : ""
          }

        </div>
      `;

  }

  if (
    activeGroup.route
  ) {

    html +=
      `
        <div class="member">

          <strong>
            🛣️ เส้นทาง
          </strong>

          <p>
            ระยะทาง:
            ${formatDistance(
              activeGroup.route
                .distance_meters
            )}
          </p>

          <p>
            เวลาโดยประมาณ:
            ${formatDuration(
              activeGroup.route
                .duration_seconds
            )}
          </p>

        </div>
      `;

  }

  html +=
    `</div>`;

  $("groupBox").innerHTML =
    html;
}

/* =====================================================
   CANCEL RIDE (ผู้โดยสาร)
===================================================== */

async function cancelRide() {

  if (!activeRide) {
    return;
  }

  if (
    !confirm(
      "ยืนยันยกเลิกการเดินทางนี้หรือไม่?"
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/rides/${activeRide.id}/cancel`,
      {
        method: "POST"
      }
    );

    showMessage(
      "ยกเลิกการเดินทางเรียบร้อย",
      "success"
    );

    activeRide =
      null;

    activeGroup =
      null;

    renderGroup();

    clearMapMarkers();

  } catch (error) {

    showMessage(
      error.message
    );

  }

}

/* =====================================================
   CONFIRM
===================================================== */

async function confirmGroup() {

  if (!activeGroup) {
    return;
  }

  try {

    const data =
      await api(
        `/api/groups/${activeGroup.id}/confirm`,
        {
          method: "POST"
        }
      );

    activeGroup =
      data.group;

    renderGroup();

  } catch (error) {

    showMessage(
      error.message
    );

  }
}

/* =====================================================
   PREVIEW
===================================================== */

function showRidePreview() {

  if (
    !currentOrigin
  ) {
    return;
  }

  const destination =
    $("destination").value.trim();

  if (!destination) {
    return;
  }

  /*
   * ตอนสร้างจริง server จะ geocode
   * ดังนั้น preview ใช้เฉพาะ origin
   */

  initMap("map");

  clearMapMarkers();

  if (!pinMarkerOrigin) {

    addPoint(
      currentOrigin.lat,
      currentOrigin.lng,
      "ตำแหน่งปัจจุบัน",
      "pickup"
    );

  }

  if (
    currentDestination &&
    !pinMarkerDestination
  ) {

    addPoint(
      currentDestination.lat,
      currentDestination.lng,
      "ปลายทาง",
      "destination"
    );

  }

}

/* =====================================================
   REALTIME
===================================================== */

async function subscribeRealtime() {

  if (!activeGroup) {
    return;
  }

  if (realtimeChannel) {

    try {

      await window.supabaseClient
        .removeChannel(
          realtimeChannel
        );

    } catch {}

  }

  const sessionData =
    getSession();

  if (
    !sessionData?.access_token
  ) {
    return;
  }

  window.supabaseClient =
    window.supabase.createClient(
      getSupabaseUrl(),
      getSupabaseKey(),
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false
        }
      }
    );

  await window.supabaseClient.auth.setSession({
    access_token:
      sessionData.access_token,

    refresh_token:
      sessionData.refresh_token
  });

  window.supabaseClient.realtime.setAuth(
    sessionData.access_token
  );

  realtimeChannel =
    window.supabaseClient
      .channel(
        `passenger-group-${activeGroup.id}`
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "ride_groups",
          filter:
            `id=eq.${activeGroup.id}`
        },
        async () => {

          await reloadActiveRide();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "ride_group_members",
          filter:
            `group_id=eq.${activeGroup.id}`
        },
        async () => {

          await reloadActiveRide();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "ride_routes",
          filter:
            `group_id=eq.${activeGroup.id}`
        },
        async () => {

          await reloadActiveRide();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "driver_locations"
        },
        (payload) => {

          if (
            payload.eventType !==
            "INSERT" &&
            payload.eventType !==
            "UPDATE"
          ) {
            return;
          }

          const location =
            payload.new;

          if (
            activeGroup.driver_id ===
            location.driver_id
          ) {

            updateDriverMarker(
              location.driver_id,
              location.latitude,
              location.longitude,
              activeGroup.driver?.name ||
                "คนขับ"
            );

          }

        }
      )

      .subscribe();

}

/* =====================================================
   RELOAD
===================================================== */

async function reloadActiveRide() {

  if (!activeRide) {
    return;
  }

  try {

    const data =
      await api(
        `/api/rides/${activeRide.id}`
      );

    activeRide =
      data.ride;

    activeGroup =
      data.group;

    renderGroup();

  } catch (error) {

    console.error(error);

  }
}

/* =====================================================
   INIT
===================================================== */

async function init() {

  session =
    getSession();

  profile =
    getProfile();

  if (
    !session ||
    !profile
  ) {

    location.href =
      "/";

    return;

  }

  if (
    profile.role !==
    "passenger"
  ) {

    location.href =
      "/driver.html";

    return;

  }

  $("welcome").textContent =
    `สวัสดี ${profile.name}`;

  initMap("map");

  upMap.on(
    "click",
    onMapClick
  );

  try {

    const data =
      await api(
        "/api/rides/active"
      );

    if (
      data.ride
    ) {

      activeRide =
        data.ride;

      activeGroup =
        data.group;

      renderGroup();

      subscribeRealtime();

    }

  } catch (error) {

    console.error(error);

  }

}

function getSupabaseUrl() {

  /*
   * Supabase URL ไม่ใช่ secret
   *
   * ใส่ URL ของ project ตรงนี้
   */

  return localStorage.getItem(
    "UP_SUPABASE_URL"
  ) || prompt(
    "ใส่ Supabase URL ครั้งแรก เช่น https://xxxx.supabase.co"
  );

}

function getSupabaseKey() {

  return localStorage.getItem(
    "UP_SUPABASE_PUBLISHABLE_KEY"
  ) || prompt(
    "ใส่ Supabase Publishable Key ครั้งแรก"
  );

}

function logout() {

  localStorage.removeItem(
    "up_drive_session"
  );

  localStorage.removeItem(
    "up_drive_profile"
  );

  location.href =
    "/";

}

init();

</script>
